<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonseal — A Retro Action RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <div id="hud-top-left">
        <div id="class-text" class="hud-label">Adventurer</div>
        <div class="bar-frame hp-frame">
          <div id="hp-fill" class="bar-fill hp"></div>
          <div id="shield-fill" class="bar-fill shield"></div>
          <div id="hp-text" class="bar-text">0 / 0</div>
        </div>
        <div class="bar-frame xp-frame">
          <div id="xp-fill" class="bar-fill xp"></div>
        </div>
        <div class="hud-row">
          <span id="lvl-text" class="hud-chip">Lv 1</span>
          <span class="hud-chip gold">◉ <span id="gold-text">0</span></span>
          <span class="hud-chip">🧪 <span id="pot-text">0</span> <small>(Q)</small></span>
        </div>
      </div>

      <div id="quest-tracker">
        <div id="zone-text" class="hud-label">Brightwood</div>
        <div id="quest-text"></div>
        <div id="seals" class="seal-pips">◇◇◇◇◇◇</div>
      </div>

      <div id="boss-bar" class="hidden">
        <div id="boss-name">Boss</div>
        <div class="bar-frame boss-frame">
          <div id="boss-fill" class="bar-fill boss"></div>
        </div>
      </div>

      <div id="bar-cluster">
        <div id="ability-bar"></div>
        <div id="dodge-slot" class="slot" title="Dodge roll (Space): brief invincibility">
          <div class="slot-icon">↷</div>
          <div id="dodge-cd" class="slot-cd"></div>
          <div class="slot-key">SPC</div>
        </div>
      </div>

      <div id="interact-hint" class="hidden"></div>
      <div id="damage-flash"></div>
    </div>

    <div id="overlay" class="hidden"></div>
    <div id="toasts"></div>
  </div>

  <!-- Load order: atlas → data → mapgen → sprites → ui → engine -->
  <script src="js/atlas.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
