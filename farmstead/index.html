<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homestead Hollow — a cozy farming game</title>
  <meta name="description" content="A cozy, single-player browser farming game. Plant, wait, harvest, decorate.">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Emoji favicon so no image files are needed -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body data-sky="day">

  <!-- ===== Header: wooden sign with farm name + weather ===== -->
  <header class="header">
    <div class="sign">
      <h1 id="farm-name" title="Click to rename your farm">My Homestead</h1>
      <p class="tagline">Homestead Hollow</p>
    </div>
    <p id="weather" class="weather">☀️ Clear skies over the farm</p>
  </header>

  <!-- ===== HUD: coins, level, XP bar, harvest count ===== -->
  <section class="hud" aria-label="Player stats">
    <div class="hud-item">🪙 <strong id="hud-coins">0</strong></div>
    <div class="hud-item">⭐ Level <strong id="hud-level">1</strong></div>
    <div class="hud-item hud-xp">
      <span class="xp-bar"><span id="hud-xp-fill" class="xp-fill"></span></span>
      <span id="hud-xp-text" class="xp-text">0 / 100 XP</span>
    </div>
    <div class="hud-item">🧺 <strong id="hud-harvested">0</strong> harvested</div>
    <div class="hud-item" id="hud-stars" hidden>🌟 ×0</div>
    <div class="hud-item hud-bonus" id="hud-bonuses" hidden>✨</div>
    <button id="sound-btn" class="icon-btn" title="Toggle sound">🔊</button>
  </section>

  <main class="layout">

    <!-- ===== Left: tools + farm grid ===== -->
    <section class="farm-area">
      <div class="toolbar" role="toolbar" aria-label="Tools">
        <button class="tool-btn active" data-tool="plant"   title="Plant selected seed">🌱 Plant</button>
        <button class="tool-btn"        data-tool="harvest" title="Harvest ready crops">🧺 Harvest</button>
        <button class="tool-btn"        data-tool="move"    title="Move decorations">↔️ Move</button>
        <button class="tool-btn"        data-tool="delete"  title="Remove decorations or dig up crops">🗑️ Delete</button>
        <button id="harvest-all-btn" class="tool-btn special" title="Harvest every ready crop at once">🧺✨ Harvest All</button>
        <span class="tool-current">Tool: <strong id="tool-label">Plant 🌱</strong></span>
      </div>

      <div id="farm-grid" class="farm-grid" aria-label="Farm grid"></div>

      <div class="achievement-row">
        <span class="achievement-label">Badges:</span>
        <span id="achievements"></span>
      </div>
    </section>

    <!-- ===== Right: shop sidebar ===== -->
    <aside class="shop">
      <h2 class="shop-title">🏪 Farm Shop</h2>
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="seeds">🌱 Seeds</button>
        <button class="shop-tab"        data-tab="decor">🪴 Decorations</button>
      </div>
      <div id="shop-list" class="shop-list"></div>

      <div class="save-controls">
        <button id="save-btn"   class="save-btn">💾 Save</button>
        <button id="export-btn" class="save-btn">📤 Export</button>
        <button id="import-btn" class="save-btn">📥 Import</button>
        <button id="reset-btn"  class="save-btn danger">♻️ Reset</button>
      </div>
    </aside>

  </main>

  <!-- ===== Toast message area ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ===== Export / Import dialog (replaces fragile window.prompt) ===== -->
  <dialog id="save-dialog" class="save-dialog">
    <h3 id="dialog-title">Export save</h3>
    <p id="dialog-hint" class="dialog-hint"></p>
    <textarea id="dialog-text" class="dialog-text" rows="8"
              spellcheck="false" aria-label="Save data JSON"></textarea>
    <input type="file" id="dialog-file" accept=".json,application/json" hidden>
    <div class="dialog-buttons">
      <button id="dialog-copy"     class="save-btn">📋 Copy</button>
      <button id="dialog-download" class="save-btn">💾 Download file</button>
      <button id="dialog-file-btn" class="save-btn">📁 Load file</button>
      <button id="dialog-import"   class="save-btn">📥 Import</button>
      <button id="dialog-close"    class="save-btn danger">✖ Close</button>
    </div>
  </dialog>

  <footer class="footer">
    <p>Homestead Hollow · an original, cozy, single-player farming game · saves live in your browser</p>
  </footer>

  <!-- Plain script files, loaded in dependency order. No build step. -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
